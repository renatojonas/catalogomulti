<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MULTI IMPRESSOS | Catálogo</title>
<meta name="theme-color" content="#FF5FA8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#FF5FA8;
  --pink-deep:#C81F74;
  --pink-soft:#FFD3E6;
  --blush:#FFF2F8;
  --ink:#33102A;
  --muted:#7A5A70;
  --line:#F3D3E3;
  --err:#B3123F;
  --r:20px;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:#fff;line-height:1.5;padding-bottom:96px}
h1,h2,h3,.display{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

/* ---------- Topo ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:68px}
.logo-slot{width:46px;height:46px;border-radius:12px;border:2px dashed var(--pink);display:grid;place-items:center;color:var(--pink-deep);font-size:10px;font-weight:700;text-align:center;line-height:1.1;flex:none;overflow:hidden}
.logo-slot.has-logo{width:auto;max-width:150px;border:0;border-radius:0}
.logo-slot img{height:46px;width:auto;max-width:150px;object-fit:contain}
.brand-name{font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-weight:800;font-size:1.08rem;letter-spacing:.01em;line-height:1.1;flex:1;min-width:0}
.cart-btn{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:999px;background:var(--pink);color:var(--ink);font-weight:700;border:2px solid var(--ink);flex:none}
.cart-btn .count{min-width:24px;height:24px;border-radius:12px;background:var(--ink);color:#fff;font-size:.8rem;display:grid;place-items:center;padding:0 6px}
.cart-btn .total{display:none}
.cart-btn.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.08)}}

/* ---------- Capa ---------- */
.hero{background:var(--pink);color:var(--ink);position:relative;overflow:hidden}
.hero .wrap{position:relative;padding:40px 20px 34px}
.hero::before,.hero::after{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--ink);opacity:.6}
.hero::before{top:14px;left:14px;border-right:0;border-bottom:0}
.hero::after{bottom:14px;right:14px;border-left:0;border-top:0}
.reg{position:absolute;right:-30px;top:50%;width:260px;height:260px;transform:translateY(-50%);opacity:.5;pointer-events:none}
.hero h1{font-size:clamp(2.1rem,6.4vw,3.7rem);line-height:1.02;letter-spacing:-.025em;font-weight:800;max-width:15ch;position:relative}
.hero p.sub{margin-top:14px;max-width:44ch;font-size:1.05rem;position:relative}
.steps{display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:22px;list-style:none;padding:0;font-weight:700;font-size:.92rem;position:relative}
.steps li{display:flex;align-items:center;gap:8px}
.steps b{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.82rem}

/* ---------- Filtros ---------- */
.filters{padding:24px 0 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 12px;margin:0 -20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:.93rem;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--pink);border-color:var(--ink)}
.controls{display:grid;gap:14px;margin-top:6px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--blush);padding:0 14px 0 44px;font:inherit;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.price{background:var(--blush);border:1.5px solid var(--line);border-radius:14px;padding:10px 16px 12px}
.price-top{display:flex;justify-content:space-between;align-items:baseline;font-size:.9rem;font-weight:700}
.price-top output{color:var(--pink-deep)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin-top:4px}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--pink) var(--pct,100%),var(--pink-soft) var(--pct,100%))}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--pink) var(--pct,100%),var(--pink-soft) var(--pct,100%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--pink);border:3px solid var(--ink);margin-top:-9px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--pink);border:3px solid var(--ink)}
.result-row{display:flex;justify-content:space-between;align-items:center;margin:18px 0 14px;font-size:.92rem;color:var(--muted);min-height:28px}
.link-btn{color:var(--pink-deep);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:36px}

/* ---------- Grade ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{display:flex;flex-direction:column;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;width:100%;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--ink);box-shadow:4px 4px 0 var(--pink)}
.thumb{position:relative;display:block;aspect-ratio:4/5;background:var(--blush)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb::before,.thumb::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--ink);opacity:.5}
.thumb::before{top:10px;left:10px;border-right:0;border-bottom:0}
.thumb::after{bottom:10px;right:10px;border-left:0;border-top:0}
.cat-badge{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 40px);background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:700;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info{display:flex;flex-direction:column;gap:8px;padding:14px;flex:1}
.info h3{font-size:1rem;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.from{font-size:.78rem;color:var(--muted);line-height:1.3}
.from strong{display:block;font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:1.25rem;color:var(--ink);font-weight:800}
.pick{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:.88rem}
.plus{width:38px;height:38px;border-radius:50%;background:var(--pink);border:2px solid var(--ink);display:grid;place-items:center}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;border:2px dashed var(--line);border-radius:var(--r)}
.empty p{margin-bottom:12px;color:var(--muted)}

.perks{background:var(--blush);border-bottom:1px solid var(--line)}
.perks ul{list-style:none;margin:0;padding:18px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 20px}
.perk{display:flex;gap:12px;align-items:center}
.perk .ic{flex:none;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;background:#fff}
.perk .ic svg{width:26px;height:26px}
.perk b{display:block;font-size:.84rem;text-transform:uppercase;letter-spacing:.02em;line-height:1.2}
.perk small{display:block;font-size:.84rem;color:var(--muted);line-height:1.25}
@media(max-width:900px){.perks ul{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.perk .ic{width:42px;height:42px}.perk .ic svg{width:22px;height:22px}.perk b,.perk small{font-size:.78rem}}
.feeds{margin-top:48px}
.feeds .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.feeds h2{font-size:1.4rem;line-height:1.2}
.feeds .nav{display:flex;gap:8px}
.feeds .nav button{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;font-size:1.2rem;cursor:pointer}
.feeds .nav button:hover{background:var(--pink)}
.fs{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:none}
.fs::-webkit-scrollbar{display:none}
.fs figure{flex:none;margin:0;width:min(240px,68vw);scroll-snap-align:start;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.fs img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.fs figcaption{padding:8px 12px;font-size:.85rem;color:var(--muted)}
.sum-row small{font-weight:400;color:var(--muted);font-size:.78rem}
.foot{margin-top:56px;background:var(--blush);border-top:1px solid var(--line);padding:30px 0}
.foot .wrap{display:flex;flex-wrap:wrap;gap:8px 28px;justify-content:space-between;font-size:.92rem;color:var(--muted)}
.foot strong{color:var(--ink)}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:14px;font-weight:700;font-size:1rem;border:2px solid var(--ink);transition:transform .1s,box-shadow .15s}
.btn.primary{background:var(--pink);color:var(--ink)}
.btn.primary:hover{box-shadow:3px 3px 0 var(--ink)}
.btn.primary:active{transform:translate(2px,2px);box-shadow:none}
.btn.ghost{background:#fff}
.btn.ghost:hover{background:var(--blush)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1.5px solid var(--line)}
.icon-btn:hover{border-color:var(--ink)}

/* ---------- Painéis ---------- */
.backdrop{position:fixed;inset:0;background:rgba(51,16,42,.5);z-index:40;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.backdrop.show{opacity:1;visibility:visible;transition-delay:0s}
.panel{position:fixed;z-index:50;background:#fff;visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility 0s .28s}
.panel.open{visibility:visible;transition-delay:0s}

/* Ficha do produto */
.sheet{left:0;right:0;bottom:0;max-height:92dvh;border-radius:24px 24px 0 0;transform:translateY(100%);overflow:hidden}
.sheet.open{transform:translateY(0)}
.sheet .close{position:absolute;top:12px;right:12px;z-index:3}
#sheet-content{overflow-y:auto;max-height:92dvh;overscroll-behavior:contain}
.sheet-media{aspect-ratio:16/10;background:var(--blush);position:relative}
.sheet-media img{width:100%;height:100%;object-fit:cover}
.sheet-main{padding:20px 20px 0}
.kicker{font-size:.82rem;font-weight:700;color:var(--pink-deep)}
.sheet-main h2{font-size:1.7rem;line-height:1.1;letter-spacing:-.01em;font-weight:800;margin:4px 0 8px}
.desc{color:var(--muted);font-size:.96rem;max-width:60ch}
fieldset{border:0;padding:0;margin:20px 0 0;min-width:0}
legend{font-weight:700;font-size:.95rem;margin-bottom:10px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt,.tier{position:relative;cursor:pointer}
.opt input,.tier input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:flex;align-items:center;min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;font-size:.94rem}
.opt input:checked+span{background:var(--pink);border-color:var(--ink);font-weight:700}
.opt input:focus-visible+span,.tier input:focus-visible+span{outline:3px solid var(--ink);outline-offset:2px}
.tiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.tier span{display:flex;flex-direction:column;gap:1px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);height:100%}
.t-q{font-weight:700;font-size:.9rem}
.t-p{font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-weight:800;font-size:1.2rem}
.t-u{font-size:.74rem;color:var(--muted)}
.tier input:checked+span{background:var(--pink);border-color:var(--ink)}
.tier input:checked+span .t-u{color:var(--ink)}
.sheet-foot{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border-top:1px solid var(--line);padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));margin:24px -20px 0}
.sheet-foot small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.sheet-foot strong{font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:1.5rem;font-weight:800;line-height:1.1}

/* Carrinho */
.drawer{top:0;right:0;bottom:0;width:min(460px,100%);transform:translateX(100%);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 14px 20px;border-bottom:1px solid var(--line);flex:none}
.drawer-head h2{font-size:1.35rem;font-weight:800}
#cart-content{flex:1;min-height:0;display:flex;flex-direction:column}
.drawer-scroll{flex:1;min-height:0;overflow-y:auto;padding:16px 20px;overscroll-behavior:contain}
.drawer-foot{flex:none;border-top:1px solid var(--line);padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));background:#fff;display:grid;gap:10px}
.sum-row{display:flex;justify-content:space-between;align-items:baseline}
.sum-row strong{font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:1.6rem;font-weight:800}
.note{font-size:.8rem;color:var(--muted)}
.sum-row.pix{margin-top:-4px}
.sum-row.pix span{color:var(--ink);font-weight:600}
.sum-row.pix strong{font-size:1.15rem;color:var(--pink-deep)}
.line{display:grid;grid-template-columns:68px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.line:first-child{padding-top:0}
.line img{width:68px;height:84px;border-radius:12px;object-fit:cover;border:1.5px solid var(--line)}
.line h3{font-size:.98rem;font-weight:700;line-height:1.25}
.line .meta{font-size:.82rem;color:var(--muted);margin-top:2px}
.line-bot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;height:40px}
.stepper button{width:40px;height:100%;display:grid;place-items:center;border-radius:999px}
.stepper button:hover{background:var(--blush)}
.stepper span{min-width:26px;text-align:center;font-weight:700}
.line-price{font-weight:700}
.rm{font-size:.8rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px;min-height:32px;margin-top:2px}
.cart-empty{text-align:center;padding:56px 12px}
.cart-empty h3{font-size:1.25rem;margin-bottom:6px}
.cart-empty p{color:var(--muted);margin-bottom:18px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--pink-deep);min-height:40px;margin-bottom:6px}
.form{display:grid;gap:14px}
.form h3{font-size:1.1rem;font-weight:800;margin-top:6px}
.field label,.field .lbl{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
.field .opt-tag{font-weight:400;color:var(--muted)}
.field input,.field textarea{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);padding:11px 14px;font:inherit;color:var(--ink);background:#fff}
.field textarea{resize:vertical;min-height:76px}
.field input:focus,.field textarea:focus{outline:3px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
.field.bad input,.field.bad textarea{border-color:var(--err)}
.err{display:none;color:var(--err);font-size:.82rem;font-weight:700;margin-top:5px}
.field.bad .err,.pay-wrap.bad .err{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pays{display:grid;gap:8px}
.pay{position:relative;cursor:pointer}
.pay input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.pay span{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);font-weight:700}
.pay input:checked+span{background:var(--pink);border-color:var(--ink)}
.pay input:focus-visible+span{outline:3px solid var(--ink);outline-offset:2px}
.recap{background:var(--blush);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.9rem;display:flex;justify-content:space-between;gap:10px}
.done{text-align:center;padding:40px 8px}
.done .tick{width:72px;height:72px;border-radius:50%;background:var(--pink);border:3px solid var(--ink);display:grid;place-items:center;margin:0 auto 18px}
.done h3{font-size:1.5rem;font-weight:800;margin-bottom:8px}
.done p{color:var(--muted);margin-bottom:22px}
.done .btn{margin-bottom:10px}

/* Barra flutuante e aviso */
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:35;display:none;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:0 20px;border-radius:18px;background:var(--pink);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-weight:700;text-align:left}
.bar.show{display:flex}
.bar b{font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:1.15rem}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:60;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:14px;font-size:.92rem;font-weight:500;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s .2s;max-width:calc(100% - 24px);width:max-content}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition-delay:0s}
.toast button{color:var(--pink);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:32px}

/* ---------- Telas maiores ---------- */
@media (min-width:600px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
  .controls{grid-template-columns:1fr 1fr;align-items:stretch}
  .cart-btn .total{display:inline}
}
@media (min-width:760px){
  .sheet{left:50%;top:50%;bottom:auto;right:auto;width:min(920px,92vw);max-height:min(88dvh,680px);border-radius:28px;transform:translate(-50%,-46%);opacity:0}
  .sheet.open{transform:translate(-50%,-50%);opacity:1}
  #sheet-content{display:grid;grid-template-columns:5fr 6fr;max-height:min(88dvh,680px);overflow:hidden}
  .sheet-media{aspect-ratio:auto;height:100%;min-height:420px}
  .sheet-main{overflow-y:auto;max-height:min(88dvh,680px);padding:30px 28px 0}
  .sheet-foot{padding:16px 28px;margin:24px -28px 0}
}
@media (min-width:960px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .bar{display:none!important}
  body{padding-bottom:0}
  .reg{right:40px;width:340px;height:340px}
}
@media (max-width:380px){
  .brand-name{font-size:.95rem}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="logo-slot" id="logo-slot" aria-label="Espaço para o logotipo">SEU<br>LOGO</div>
    <div class="brand-name" id="brand-name">MULTI IMPRESSOS</div>
    <button class="cart-btn" id="cart-btn" aria-label="Abrir carrinho">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="total" id="hdr-total"></span>
      <span class="count" id="hdr-count">0</span>
    </button>
  </div>
</header>

<section class="hero" aria-label="Apresentação">
  <svg class="reg" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="1.2" aria-hidden="true"><circle cx="50" cy="50" r="22"/><circle cx="50" cy="50" r="38"/><path d="M50 2v96M2 50h96"/></svg>
  <div class="wrap">
    <h1 id="hero-title"></h1>
    <p class="sub" id="hero-sub"></p>
    <ol class="steps">
      <li><b>1</b> Escolha o produto</li>
      <li><b>2</b> Monte o carrinho</li>
      <li><b>3</b> Envie pelo WhatsApp</li>
    </ol>
  </div>
</section>

<section class="perks" id="perks" aria-label="Vantagens" hidden><div class="wrap"><ul id="perks-list"></ul></div></section>

<section class="filters" aria-label="Filtros">
  <div class="wrap">
    <div class="chips" id="chips" role="group" aria-label="Categorias"></div>
    <div class="controls">
      <div class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label class="sr" for="q">Buscar produto</label>
        <input id="q" type="search" placeholder="Buscar produto" autocomplete="off">
      </div>
    </div>
  </div>
</section>

<main class="wrap" id="produtos">
  <div class="result-row" aria-live="polite"><span id="count"></span><button class="link-btn" id="clear" hidden>Limpar filtros</button></div>
  <div class="grid" id="grid"></div>
</main>

<section class="feeds wrap" id="feeds" aria-label="Feedbacks de clientes" hidden><div class="hd"><h2 id="feeds-title"></h2><div class="nav"><button data-fs="-1" aria-label="Anterior">‹</button><button data-fs="1" aria-label="Próximo">›</button></div></div><div class="fs" id="fs"></div></section>

<footer class="foot">
  <div class="wrap">
    <span><strong id="foot-name"></strong><br>Pedidos pelo WhatsApp <span id="foot-phone"></span></span>
    <span>Pagamento por Pix, cartão de crédito ou débito.<br>Frete e prazo combinados na conversa.</span>
  </div>
</footer>

<button class="bar" id="bar" aria-label="Abrir carrinho"><span id="bar-label"></span><b id="bar-total"></b></button>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button id="toast-act" hidden></button></div>
<div class="backdrop" id="backdrop"></div>

<section class="panel sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <button class="icon-btn close" data-close aria-label="Fechar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <div id="sheet-content"></div>
</section>

<aside class="panel drawer" id="cart" role="dialog" aria-modal="true" aria-labelledby="cart-title">
  <div class="drawer-head">
    <h2 id="cart-title">Seu pedido</h2>
    <button class="icon-btn" data-close aria-label="Fechar carrinho">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div id="cart-content"></div>
</aside>

<script>
(function () {
  'use strict';

  /* ---------- Dados ---------- */
  var data = JSON.parse(document.getElementById('catalog-data').textContent);
  var cfg = data.config || {};
  var cats = data.categorias || [];
  var prods = (data.produtos || []).map(function (p) {
    p.variacoes = (p.variacoes || []).filter(function (g) { return g && g.nome && g.opcoes && g.opcoes.length; });
    p.precos = (p.precos || []).slice().sort(function (a, b) { return a.qtd - b.qtd; });
    return p;
  });
  var byId = {};
  prods.forEach(function (p) { byId[p.id] = p; });

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var money = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  var moneyFine = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2, maximumFractionDigits: 3 });
  var num = new Intl.NumberFormat('pt-BR');
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var norm = function (s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); };
  var qtyLabel = function (q) { return num.format(q) + ' un'; };

  function load(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var KEY_CART = 'multi_impressos_carrinho_v1';
  var KEY_CLIENT = 'multi_impressos_cliente_v1';

  /* ---------- Imagem padrão (quando o produto não tem foto) ---------- */
  var artCache = {};
  function art(p) {
    if (artCache[p.id]) return artCache[p.id];
    var i = Math.max(0, cats.indexOf(p.categoria)) % 5;
    var bgs = ['#FFE3EF', '#FFD3E6', '#FFEAF3', '#FFC9E0'];
    var bg = bgs[Math.max(0, prods.indexOf(p)) % 4];
    var ink = '#33102A', pk = '#FF5FA8', w = '#fff';
    var sw = 'stroke="' + ink + '" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"';
    var shapes = [
      '<circle cx="110" cy="390" r="44" fill="' + pk + '" ' + sw + '/><g transform="rotate(-12 200 280)"><path d="M200 205C200 130 250 100 288 66" fill="none" ' + sw + '/><circle cx="200" cy="290" r="108" fill="' + w + '" ' + sw + '/><circle cx="200" cy="210" r="13" fill="' + bg + '" ' + sw + '/><path d="M158 280h84M172 310h56" fill="none" ' + sw + '/></g>',
      '<g transform="rotate(-8 200 260)"><rect x="70" y="160" width="250" height="150" rx="12" fill="' + pk + '" ' + sw + '/></g><g transform="rotate(6 210 320)"><rect x="85" y="245" width="250" height="150" rx="12" fill="' + w + '" ' + sw + '/><circle cx="125" cy="292" r="16" fill="' + pk + '" ' + sw + '/><path d="M160 285h130M160 310h90M112 360h150" fill="none" ' + sw + '/></g>',
      '<g transform="rotate(8 200 280)"><path d="M200 195C150 125 140 75 190 60c45-12 70 40 10 135z" fill="none" ' + sw + '/><path d="M150 195h100l40 40v185a12 12 0 0 1-12 12H122a12 12 0 0 1-12-12V235z" fill="' + w + '" ' + sw + '/><circle cx="200" cy="222" r="11" fill="' + bg + '" ' + sw + '/><rect x="140" y="290" width="120" height="64" rx="8" fill="' + pk + '" ' + sw + '/><path d="M140 385h120" fill="none" ' + sw + '/></g>',
      '<circle cx="200" cy="250" r="132" fill="' + w + '" ' + sw + '/><circle cx="200" cy="250" r="102" fill="' + pk + '" ' + sw + '/><path d="M200 312C150 276 150 228 180 225c15-1 20 11 20 11s5-12 20-11c30 3 30 51-20 87z" fill="' + w + '" ' + sw + '/><path d="M268 362c34-10 54-30 64-44 6 42-12 70-48 62z" fill="' + bg + '" ' + sw + '/>',
      '<g transform="rotate(12 275 160)"><rect x="240" y="100" width="70" height="100" rx="8" fill="' + w + '" ' + sw + '/><circle cx="275" cy="124" r="8" fill="' + pk + '" ' + sw + '/></g><rect x="85" y="260" width="230" height="150" rx="10" fill="' + w + '" ' + sw + '/><rect x="75" y="214" width="250" height="52" rx="10" fill="' + pk + '" ' + sw + '/><path d="M200 214v196" fill="none" ' + sw + '/><path d="M200 214c-30-62-82-30-50 0M200 214c30-62 82-30 50 0" fill="none" ' + sw + '/>'
    ];
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><rect width="400" height="500" fill="' + bg + '"/>' + shapes[i] + '</svg>';
    artCache[p.id] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    return artCache[p.id];
  }
  function img(p) { return p.imagem || art(p); }

  /* ---------- Preços ---------- */
  function minTier(p) {
    if (!p.precos.length) return null;
    return p.precos.reduce(function (a, b) { return b.valor < a.valor ? b : a; });
  }
  function tierOf(p, qtd) {
    for (var i = 0; i < p.precos.length; i++) if (p.precos[i].qtd === qtd) return p.precos[i];
    return null;
  }

  /* ---------- Estado ---------- */
  var cart = load(KEY_CART, []).filter(function (it) {
    var p = byId[it.pid];
    return p && tierOf(p, it.qtd) && it.n >= 1;
  });
  var priceTop = prods.reduce(function (m, p) { var t = minTier(p); return t ? Math.max(m, t.valor) : m; }, 0);
  var sMax = Math.max(10, Math.ceil(priceTop / 10) * 10);
  var f = { cat: '', q: '', max: sMax };
  var sheetState = null;
  var cartView = 'items';
  var lastUrl = '';
  var active = null, lastFocus = null;

  function persist() { save(KEY_CART, cart); }
  function cartCount() { return cart.reduce(function (s, it) { return s + it.n; }, 0); }
  function lineTotal(it) { return tierOf(byId[it.pid], it.qtd).valor * it.n; }
  function brl(v) { return money.format(v).replace(/\s/g, ''); }
  function r2(v) { return Math.round(v * 100) / 100; }
  function freteVal() { return Math.max(0, Number(cfg.frete) || 0); }
  function orderTotal() { return r2(cartTotal() + freteVal()); }
  function pixTotal() { var d = Math.max(0, Number(cfg.descontoPix) || 0); return r2(orderTotal() - cartTotal() * d / 100); }
  function cartTotal() { return cart.reduce(function (s, it) { return s + lineTotal(it); }, 0); }
  function selText(sel) {
    return Object.keys(sel || {}).map(function (k) { return k + ': ' + sel[k]; }).join(' · ');
  }
  function itemKey(pid, qtd, sel) {
    return pid + '|' + qtd + '|' + Object.keys(sel).sort().map(function (k) { return k + '=' + sel[k]; }).join(';');
  }

  /* ---------- Cabeçalho, capa e rodapé ---------- */
  function phoneDigits() {
    var d = String(cfg.whatsapp || '').replace(/\D/g, '');
    if (d.indexOf('55') !== 0) d = '55' + d;
    return d;
  }
  function initBrand() {
    var name = cfg.nome || 'Catálogo';
    document.title = name + ' | Catálogo';
    $('#brand-name').textContent = name;
    $('#foot-name').textContent = name;
    $('#foot-phone').textContent = cfg.whatsapp ? '· ' + cfg.whatsapp : '';
    $('#hero-title').textContent = cfg.titulo || '';
    $('#hero-sub').textContent = cfg.subtitulo || '';
    if (cfg.logo) {
      var slot = $('#logo-slot');
      slot.classList.add('has-logo');
      slot.innerHTML = '<img alt="Logotipo ' + esc(name) + '" src="' + esc(cfg.logo) + '">';
      slot.removeAttribute('aria-label');
    }
  }

  /* ---------- Filtros e grade ---------- */
  function renderChips() {
    var all = [''].concat(cats);
    $('#chips').innerHTML = all.map(function (c) {
      return '<button class="chip" data-cat="' + esc(c) + '" aria-pressed="' + (f.cat === c) + '">' + esc(c || 'Todos') + '</button>';
    }).join('');
  }
  function visible() {
    var q = norm(f.q);
    return prods.filter(function (p) {
      if (f.cat && p.categoria !== f.cat) return false;
      if (q && norm(p.nome + ' ' + p.descricao + ' ' + p.categoria).indexOf(q) === -1) return false;
      var t = minTier(p);
      if (t && t.valor > f.max) return false;
      return true;
    });
  }
  function renderGrid() {
    var list = visible();
    var filtered = f.cat || f.q || f.max < sMax;
    $('#count').textContent = list.length === 1 ? '1 produto' : list.length + ' produtos';
    $('#clear').hidden = !filtered;
    if (!list.length) {
      $('#grid').innerHTML = '<div class="empty"><p>Nenhum produto encontrado com esses filtros.</p><button class="btn ghost" data-clear>Limpar filtros</button></div>';
      return;
    }
    $('#grid').innerHTML = list.map(function (p) {
      var t = minTier(p);
      var price = t
        ? '<span class="from">a partir de<strong>' + money.format(t.valor) + '</strong>' + qtyLabel(t.qtd) + '</span>'
        : '<span class="from"><strong>Consulte</strong>os valores</span>';
      return '<button class="card" data-open="' + esc(p.id) + '" aria-label="' + esc(p.nome) + ', escolher quantidade">' +
        '<span class="thumb"><img loading="lazy" alt="" src="' + esc(img(p)) + '"><span class="cat-badge">' + esc(p.categoria) + '</span></span>' +
        '<span class="info"><h3>' + esc(p.nome) + '</h3>' + price +
        '<span class="pick">Escolher<span class="plus"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></span></span>' +
        '</button>';
    }).join('');
  }
  function clearFilters() {
    f.cat = ''; f.q = ''; f.max = sMax;
    $('#q').value = '';
    renderChips(); renderGrid();
  }

  /* ---------- Painéis (abrir / fechar) ---------- */
  function openPanel(el, trigger) {
    if (active && active !== el) closePanel(true);
    lastFocus = trigger || lastFocus || document.activeElement;
    active = el;
    el.classList.add('open');
    $('#backdrop').classList.add('show');
    document.body.style.overflow = 'hidden';
    updateBar();
    setTimeout(function () {
      var c = el.querySelector('[data-close]');
      if (c) c.focus();
    }, 50);
  }
  function closePanel(keepFocus) {
    if (!active) return;
    active.classList.remove('open');
    active = null;
    $('#backdrop').classList.remove('show');
    document.body.style.overflow = '';
    updateBar();
    if (!keepFocus && lastFocus && lastFocus.focus) lastFocus.focus();
  }
  document.addEventListener('keydown', function (e) {
    if (!active) return;
    if (e.key === 'Escape') { closePanel(); return; }
    if (e.key === 'Tab') {
      var items = active.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea,a[href]');
      items = Array.prototype.filter.call(items, function (n) { return n.offsetParent !== null || n === document.activeElement; });
      if (!items.length) return;
      var first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  $('#backdrop').addEventListener('click', function () { closePanel(); });
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) closePanel();
  });

  /* ---------- Ficha do produto ---------- */
  function openSheet(id, trigger) {
    var p = byId[id]; if (!p) return;
    var first = p.precos[0];
    sheetState = { p: p, qtd: first ? first.qtd : null, sel: {} };
    p.variacoes.forEach(function (g) { sheetState.sel[g.nome] = g.opcoes[0]; });
    var vars = p.variacoes.map(function (g, gi) {
      return '<fieldset><legend>' + esc(g.nome) + '</legend><div class="opts">' +
        g.opcoes.map(function (o, oi) {
          return '<label class="opt"><input type="radio" name="v' + gi + '" data-var="' + esc(g.nome) + '" value="' + esc(o) + '"' + (oi === 0 ? ' checked' : '') + '><span>' + esc(o) + '</span></label>';
        }).join('') + '</div></fieldset>';
    }).join('');
    var tiers = p.precos.length
      ? '<fieldset><legend>Quantidade</legend><div class="tiers">' +
        p.precos.map(function (t, ti) {
          return '<label class="tier"><input type="radio" name="qtd" value="' + t.qtd + '"' + (ti === 0 ? ' checked' : '') + '><span><span class="t-q">' + qtyLabel(t.qtd) + '</span><span class="t-p">' + money.format(t.valor) + '</span><span class="t-u">' + moneyFine.format(t.valor / t.qtd) + ' cada</span></span></label>';
        }).join('') + '</div></fieldset>'
      : '<p class="desc" style="margin-top:20px">Os valores deste produto são combinados pelo WhatsApp.</p>';
    $('#sheet-content').innerHTML =
      '<div class="sheet-media"><img alt="" src="' + esc(img(p)) + '"></div>' +
      '<div class="sheet-main">' +
        '<span class="kicker">' + esc(p.categoria) + '</span>' +
        '<h2 id="sheet-title">' + esc(p.nome) + '</h2>' +
        '<p class="desc">' + esc(p.descricao) + '</p>' + vars + tiers +
        '<div class="sheet-foot"><div><small>Total</small><strong id="sheet-total"></strong></div>' +
        '<button class="btn primary" id="add-btn"' + (first ? '' : ' disabled') + '>Adicionar ao carrinho</button></div>' +
      '</div>';
    updateSheetTotal();
    openPanel($('#sheet'), trigger);
  }
  function updateSheetTotal() {
    if (!sheetState) return;
    var t = tierOf(sheetState.p, sheetState.qtd);
    $('#sheet-total').textContent = t ? money.format(t.valor) : '—';
  }
  $('#sheet').addEventListener('change', function (e) {
    if (!sheetState) return;
    if (e.target.name === 'qtd') { sheetState.qtd = parseInt(e.target.value, 10); updateSheetTotal(); }
    else if (e.target.dataset.var) { sheetState.sel[e.target.dataset.var] = e.target.value; }
  });
  $('#sheet').addEventListener('click', function (e) {
    if (!e.target.closest('#add-btn') || !sheetState) return;
    addToCart(sheetState.p.id, sheetState.qtd, sheetState.sel);
    closePanel(true);
    toast('Adicionado ao carrinho', 'Ver carrinho', function () { openCart($('#cart-btn')); });
    var b = $('#cart-btn'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
  });

  /* ---------- Carrinho ---------- */
  function addToCart(pid, qtd, sel) {
    var key = itemKey(pid, qtd, sel), found = null;
    cart.forEach(function (it) { if (itemKey(it.pid, it.qtd, it.sel) === key) found = it; });
    if (found) found.n = Math.min(99, found.n + 1);
    else cart.push({ pid: pid, qtd: qtd, sel: JSON.parse(JSON.stringify(sel)), n: 1 });
    persist(); updateBar(); renderCart();
  }
  function updateBar() {
    var n = cartCount(), tot = money.format(cartTotal());
    $('#hdr-count').textContent = n;
    $('#hdr-total').textContent = n ? tot : '';
    $('#bar-label').textContent = 'Ver carrinho · ' + n + (n === 1 ? ' item' : ' itens');
    $('#bar-total').textContent = tot;
    $('#bar').classList.toggle('show', n > 0 && !active);
  }
  function openCart(trigger) {
    if (cartView === 'done' && !cart.length) cartView = 'items';
    renderCart();
    openPanel($('#cart'), trigger);
  }
  var WA_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.7-5.2A8.5 8.5 0 1 1 21 11.5z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-1.6-2-1-.9.8c-.8-.4-1.5-1.1-1.9-1.9l.8-.9-1-2L9 9.5z"/></svg>';

  function renderCart() {
    var box = $('#cart-content');
    if (cartView === 'done') {
      box.innerHTML = '<div class="drawer-scroll"><div class="done">' +
        '<div class="tick"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
        '<h3>Pedido pronto para enviar</h3>' +
        '<p>Abrimos o WhatsApp com o resumo do seu pedido. Falta só tocar em enviar a mensagem.</p>' +
        '<button class="btn primary block" data-act="reopen">' + WA_ICON + ' Abrir o WhatsApp de novo</button>' +
        '<button class="btn ghost block" data-act="newOrder">Fazer um novo pedido</button>' +
        '</div></div>';
      return;
    }
    if (!cart.length) {
      box.innerHTML = '<div class="drawer-scroll"><div class="cart-empty"><h3>Seu carrinho está vazio</h3><p>Escolha um produto e a quantidade para montar o pedido.</p><button class="btn primary" data-act="shop">Ver produtos</button></div></div>';
      return;
    }
    if (cartView === 'checkout') { renderCheckout(); return; }
    var lines = cart.map(function (it, i) {
      var p = byId[it.pid];
      var st = selText(it.sel);
      return '<div class="line"><img alt="" src="' + esc(img(p)) + '"><div>' +
        '<h3>' + esc(p.nome) + '</h3>' +
        '<div class="meta">' + (st ? esc(st) + ' · ' : '') + qtyLabel(it.qtd) + ' por lote</div>' +
        '<div class="line-bot">' +
        '<div class="stepper" role="group" aria-label="Quantidade de lotes">' +
          '<button data-act="dec" data-i="' + i + '" aria-label="Diminuir"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>' +
          '<span aria-live="polite">' + it.n + '</span>' +
          '<button data-act="inc" data-i="' + i + '" aria-label="Aumentar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>' +
        '</div><span class="line-price">' + money.format(lineTotal(it)) + '</span></div>' +
        '<button class="rm" data-act="rm" data-i="' + i + '">Remover</button>' +
        '</div></div>';
    }).join('');
    var par = Math.max(0, parseInt(cfg.parcelas, 10) || 0);
    box.innerHTML = '<div class="drawer-scroll">' + lines + '</div>' +
      '<div class="drawer-foot">' +
        (freteVal() > 0 ? '<div class="sum-row"><span>Subtotal</span><strong>' + money.format(cartTotal()) + '</strong></div><div class="sum-row"><span>Frete</span><strong>' + money.format(freteVal()) + '</strong></div>' : '') +
        '<div class="sum-row"><span>Total no cartão' + (par > 1 ? '<br><small>ou ' + par + 'x de ' + money.format(r2(orderTotal() / par)) + '</small>' : '') + '</span><strong>' + money.format(orderTotal()) + '</strong></div>' +
        '<div class="sum-row pix"><span>Total no Pix</span><strong>' + money.format(pixTotal()) + '</strong></div>' +
        '<button class="btn primary block" data-act="send">' + WA_ICON + ' Enviar pedido pelo WhatsApp</button>' +
        '<button class="btn ghost block" data-act="shop">Continuar comprando</button>' +
      '</div>';
  }

  function buildMessage() {
    var L = [], par = Math.max(0, parseInt(cfg.parcelas, 10) || 0);
    L.push('📋 *Orçamento - Detalhes do Pedido:*', '');
    cart.forEach(function (it) {
      var p = byId[it.pid], st = selText(it.sel);
      L.push('➡️ ' + p.nome + (st ? ' (' + st + ')' : '') + ' | ' + it.n + ' × ' + qtyLabel(it.qtd) + ' = ' + brl(lineTotal(it)));
    });
    L.push('', '🔹 *Subtotal:* ' + brl(cartTotal()));
    if (freteVal() > 0) L.push('🚚 *Frete:* ' + brl(freteVal()));
    L.push('', '💳 *Total no cartão:* ' + brl(orderTotal()));
    if (par > 1) L.push('_ou ' + par + 'x de ' + brl(r2(orderTotal() / par)) + '_');
    L.push('✨ *Total no Pix:* ' + brl(pixTotal()));
    if (freteVal() <= 0) L.push('', 'Frete e prazo combinamos por aqui. Obrigado!');
    return L.join('\n');
  }

  function sendOrder() {
    if (!cart.length) return;
    lastUrl = 'https://wa.me/' + phoneDigits() + '?text=' + encodeURIComponent(buildMessage());
    var w = window.open(lastUrl, '_blank');
    if (!w) window.location.href = lastUrl;
    cartView = 'done';
    renderCart();
  }

  $('#cart').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act, i = parseInt(b.dataset.i, 10);
    if (act === 'inc') { cart[i].n = Math.min(99, cart[i].n + 1); }
    else if (act === 'dec') { cart[i].n = Math.max(1, cart[i].n - 1); }
    else if (act === 'rm') { cart.splice(i, 1); }
    else if (act === 'checkout') { cartView = 'checkout'; renderCart(); var s = $('#cart .drawer-scroll'); if (s) s.scrollTop = 0; return; }
    else if (act === 'toItems') { cartView = 'items'; }
    else if (act === 'shop') { closePanel(true); var g = $('#produtos'); if (g) g.scrollIntoView({ behavior: 'smooth' }); return; }
    else if (act === 'send') { sendOrder(); return; }
    else if (act === 'reopen') { window.open(lastUrl, '_blank'); return; }
    else if (act === 'newOrder') { cart = []; cartView = 'items'; persist(); updateBar(); closePanel(); return; }
    persist(); updateBar(); renderCart();
  });
  $('#cart').addEventListener('input', function (e) {
    var fl = e.target.closest('.field'); if (fl && e.target.value.trim()) fl.classList.remove('bad');
    if (e.target.name === 'pag') $('#pay-wrap').classList.remove('bad');
  });

  /* ---------- Aviso rápido ---------- */
  var toastTimer;
  function toast(msg, actLabel, actFn) {
    $('#toast-msg').textContent = msg;
    var a = $('#toast-act');
    if (actLabel) { a.hidden = false; a.textContent = actLabel; a.onclick = function () { $('#toast').classList.remove('show'); actFn(); }; }
    else a.hidden = true;
    $('#toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('#toast').classList.remove('show'); }, 4000);
  }

  /* ---------- Eventos gerais ---------- */
  $('#chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    f.cat = b.dataset.cat; renderChips(); renderGrid();
  });
  $('#q').addEventListener('input', function (e) { f.q = e.target.value; renderGrid(); });
  $('#clear').addEventListener('click', clearFilters);
  $('#grid').addEventListener('click', function (e) {
    if (e.target.closest('[data-clear]')) { clearFilters(); return; }
    var c = e.target.closest('[data-open]'); if (c) openSheet(c.dataset.open, c);
  });
  $('#cart-btn').addEventListener('click', function (e) { openCart(e.currentTarget); });
  $('#bar').addEventListener('click', function (e) { openCart(e.currentTarget); });

  /* ---------- Início ---------- */
  initBrand();
  var ICONS = {"percent": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6 6 18\"/><circle cx=\"7.5\" cy=\"7.5\" r=\"2\"/><circle cx=\"16.5\" cy=\"16.5\" r=\"2\"/></svg>", "truck": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 6h11v10H2zM13 9h4l3 3v4h-7\"/><circle cx=\"6.5\" cy=\"17.5\" r=\"1.7\"/><circle cx=\"16.5\" cy=\"17.5\" r=\"1.7\"/></svg>", "chat": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16v11H9l-5 4z\"/></svg>", "star": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z\"/></svg>", "heart": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20s-8-4.6-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5C20 15.4 12 20 12 20z\"/></svg>", "card": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"6\" width=\"18\" height=\"12\" rx=\"2\"/><path d=\"M3 10h18M7 15h4\"/></svg>", "gift": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"9\" width=\"16\" height=\"11\"/><path d=\"M3 9h18v-3H3zM12 6v14M12 6c-3-4-6 0-2 0M12 6c3-4 6 0 2 0\"/></svg>", "clock": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/></svg>", "shield": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z\"/><path d=\"m9 12 2 2 4-4\"/></svg>", "pin": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z\"/><circle cx=\"12\" cy=\"10\" r=\"2.5\"/></svg>"};
  function initExtras() {
    var b = (data.beneficios || []).filter(function (x) { return x && x.titulo; });
    if (b.length) {
      $('#perks-list').innerHTML = b.map(function (x) { return '<li class="perk"><span class="ic">' + (ICONS[x.icone] || ICONS.star) + '</span><div><b>' + esc(x.titulo) + '</b><small>' + esc(x.texto || '') + '</small></div></li>'; }).join('');
      $('#perks').hidden = false;
    }
    var f = (data.feedbacks || []).filter(function (x) { return x && x.imagem; });
    if (f.length) {
      $('#feeds-title').textContent = cfg.feedTitulo || 'Clientes satisfeitos';
      $('#fs').innerHTML = f.map(function (x) { return '<figure><img loading="lazy" alt="Feedback de cliente" src="' + esc(x.imagem) + '">' + (x.nome ? '<figcaption>' + esc(x.nome) + '</figcaption>' : '') + '</figure>'; }).join('');
      $('#feeds').hidden = false;
      document.querySelectorAll('[data-fs]').forEach(function (bt) { bt.onclick = function () { var s = $('#fs'); s.scrollBy({ left: Number(bt.dataset.fs) * s.clientWidth * 0.8, behavior: 'smooth' }); }; });
    }
  }
  initExtras();
  renderChips();
  renderGrid();
  updateBar();
})();
</script>
</body>
</html>
